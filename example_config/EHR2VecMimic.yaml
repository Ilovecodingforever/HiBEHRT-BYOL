env_params:
  gpus: 1
  accumulate_grad_batches: 4
  max_epochs: 5
  log_every_n_steps: 50
  num_sanity_val_steps: 0
callback_params:
  monitor: average_precision
  mode: max
  save_top_k: 1
  save_last: true
  filename: save_ckpt
base_params:
  dataloader: EHR2VecDataLoader
  dataloader_params:
    token_dict_path: ./data/mimic/dict4all
    age_dict_path: ./data/mimic/dict4age
    max_seq_length: 1500
    segment_length: 100
    move_length: 50
    mordality: null
  model: EHR2Vec
  model_params:
    vocab_size: 0
    seg_vocab_size: 2
    age_vocab_size: 0
    max_position_length: 1500
    hidden_size: 256
    hidden_dropout_prob: 0.2
    attention_probs_dropout_prob: 0.2
    num_attention_heads: 4
    intermediate_size: 1024
    hidden_act: gelu
    extractor_num_layer: 4
    aggregator_num_layer: 4
    initializer_range: 0.02
    optimiser: Adam
    optimiser_params: {'lr': 0.00005, 'weight_decay': 0.0, 'warmup_proportion': 0.1}
    lr_strategy: fixed
    manual_valid: true
train_params:
  data_path: ./data/mimic/labeled_train_10k.parquet
  batch_size: 8
  shuffle: true
  num_workers: 3
  aug_prob: 0.25
  mask_prob: 0.05
  drop_prob: 0.05
  is_train: true
  selection: null
  len_range: null
  year_range: null
  age_range: null
  positive_percent: null
  ratio: null
eval_params:
  data_path: ./data/mimic/labeled_valid_2k.parquet
  batch_size: 8
  shuffle: false
  num_workers: 3
  aug_prob: 0.0
  mask_prob: 0.0
  drop_prob: 0.0
  is_train: false
  selection: null
  len_range: null
  year_range: null
  age_range: null
  positive_percent: null
  ratio: null
